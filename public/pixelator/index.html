<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixelator — Akshaya Kumar T</title>
    <meta name="description" content="Turn any photo into chunky retro pixel art.">
    <style>
        :root{--bg:#fff;--fg:#111;--muted:#6b6b6b;--line:#e8e8e8;--accent:#2563eb;--stage:#f4f4f2}
        @media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--fg:#f2f2f2;--muted:#8d8d92;--line:#232326;--accent:#7aa2ff;--stage:#141416}}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
        main{max-width:720px;margin:0 auto;padding:56px 24px 80px}
        a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
        h1{font-size:1.5rem;margin:16px 0 4px}
        .d{color:var(--muted);font-size:.92rem;margin:0 0 24px}
        .stage{background:var(--stage);border-radius:16px;padding:24px;display:grid;place-items:center;border:1px dashed var(--line)}
        .stage.over{border-color:var(--accent)}
        canvas{max-width:100%;height:auto;image-rendering:pixelated;border-radius:4px}
        .controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
        label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
        select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
        input[type=range]{width:100%}
        .btns{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
        button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:.9rem;cursor:pointer}
        button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
        input[type=file]{display:none}
        @media(max-width:520px){.controls{grid-template-columns:1fr}}
    </style>
</head>
<body>
<main>
    <a href="/projects/">← Projects</a>
    <h1>Pixelator</h1>
    <p class="d">Drop in a PNG, JPEG or WebP photo and slide it from smooth to chunky 8-bit. Everything happens in your browser, nothing is uploaded.</p>
    <p id="err" class="d" style="color:#d33;min-height:1.4em;margin:0 0 8px"></p>
    <div class="stage" id="stage"><canvas id="c"></canvas></div>

    <div class="controls">
        <div><label for="size">Pixel size</label><input id="size" type="range" min="3" max="40" step="1" value="12"></div>
        <div><label for="pal">Palette</label>
            <select id="pal"><option value="orig">Original colors</option><option value="gb">Game Boy</option><option value="bw">Black &amp; white</option><option value="cga">Retro cyan/magenta</option></select></div>
        <div><label for="lv">Colors per channel (Original only)</label><input id="lv" type="range" min="2" max="8" step="1" value="5"></div>
    </div>

    <div class="btns">
        <button class="primary" id="dl">Download PNG</button>
        <button id="pick">Choose photo</button>
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp">
    </div>
</main>
<script>
    const $=id=>document.getElementById(id);
    const c=$('c'),ctx=c.getContext('2d',{willReadFrequently:true});
    const OUT=640;
    let img=null;
    (function(){
        const g=document.createElement('canvas');g.width=800;g.height=600;
        const x=g.getContext('2d'),gr=x.createLinearGradient(0,0,800,600);
        gr.addColorStop(0,'#38bdf8');gr.addColorStop(.5,'#a78bfa');gr.addColorStop(1,'#fb7185');
        x.fillStyle=gr;x.fillRect(0,0,800,600);
        x.fillStyle='rgba(255,255,255,.92)';x.font='600 64px system-ui';x.textAlign='center';
        x.fillText('drop a photo',400,320);img=g;
    })();

    const PALS={
        gb:['#0f380f','#306230','#8bac0f','#9bbc0f'],
        bw:['#000000','#ffffff'],
        cga:['#000000','#55ffff','#ff55ff','#ffffff']
    };
    const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

    function draw(){
        const size=+$('size').value,pal=$('pal').value,lv=+$('lv').value;
        const ow=img.width>=img.height?OUT:Math.round(OUT*img.width/img.height);
        const oh=img.width>=img.height?Math.round(OUT*img.height/img.width):OUT;
        const cw=Math.max(1,Math.round(ow/size)),ch=Math.max(1,Math.round(oh/size));

        const s=document.createElement('canvas');s.width=cw;s.height=ch;
        const sx=s.getContext('2d',{willReadFrequently:true});
        sx.imageSmoothingEnabled=true;sx.drawImage(img,0,0,cw,ch);
        const d=sx.getImageData(0,0,cw,ch),p=d.data;
        const colors=pal==='orig'?null:PALS[pal].map(hex);

        for(let i=0;i<p.length;i+=4){
            let r=p[i],g=p[i+1],b=p[i+2];
            if(!colors){
                const q=v=>Math.round(v/255*(lv-1))/(lv-1)*255;
                r=q(r);g=q(g);b=q(b);
            }else if(pal==='gb'||pal==='bw'){
                const l=.299*r+.587*g+.114*b;
                const n=colors.length,idx=Math.min(n-1,Math.floor(l/256*n));
                [r,g,b]=colors[idx];
            }else{
                let best=1e9,bc=colors[0];
                for(const k of colors){const e=(r-k[0])**2+(g-k[1])**2+(b-k[2])**2;if(e<best){best=e;bc=k;}}
                [r,g,b]=bc;
            }
            p[i]=r;p[i+1]=g;p[i+2]=b;
        }
        sx.putImageData(d,0,0);

        c.width=cw*size;c.height=ch*size;
        ctx.imageSmoothingEnabled=false;
        ctx.drawImage(s,0,0,c.width,c.height);
    }

    const OK=['image/png','image/jpeg','image/webp'];
    function msg(t){$('err').textContent=t;}
    function load(file){
        if(!file)return;
        if(!OK.includes(file.type)){msg('Please use a PNG, JPEG or WebP image.');return;}
        const i=new Image();
        i.onload=()=>{img=i;msg('');draw();};
        i.onerror=()=>msg('That image could not be read. Try another one.');
        i.src=URL.createObjectURL(file);
    }
    ['size','pal','lv'].forEach(id=>$(id).addEventListener('input',draw));
    $('pick').onclick=()=>$('file').click();
    $('file').onchange=e=>load(e.target.files[0]);
    const st=$('stage');
    st.addEventListener('dragover',e=>{e.preventDefault();st.classList.add('over');});
    st.addEventListener('dragleave',()=>st.classList.remove('over'));
    st.addEventListener('drop',e=>{e.preventDefault();st.classList.remove('over');load(e.dataTransfer.files[0]);});
    $('dl').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pixel-art.png';a.click();});
    draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trading Card — Akshaya Kumar T</title>
    <meta name="description" content="Turn your photo into a collectible trading card with custom stats.">
    <style>
        :root{--bg:#fff;--fg:#111;--muted:#6b6b6b;--line:#e8e8e8;--accent:#2563eb;--stage:#f4f4f2}
        @media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--fg:#f2f2f2;--muted:#8d8d92;--line:#232326;--accent:#7aa2ff;--stage:#141416}}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
        main{max-width:720px;margin:0 auto;padding:56px 24px 80px}
        a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
        h1{font-size:1.5rem;margin:16px 0 4px}
        .d{color:var(--muted);font-size:.92rem;margin:0 0 24px}
        .stage{background:var(--stage);border-radius:16px;padding:32px;display:grid;place-items:center;border:1px dashed var(--line)}
        .stage.over{border-color:var(--accent)}
        canvas{cursor:grab;touch-action:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.3));max-width:100%;height:auto}
        canvas:active{cursor:grabbing}
        .controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
        .pair{display:grid;grid-template-columns:1fr 64px;gap:8px}
        label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
        input[type=text],input[type=number],select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
        input[type=range]{width:100%}
        .btns{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;align-items:center}
        button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:.9rem;cursor:pointer}
        button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
        input[type=file]{display:none}
        @media(max-width:520px){.controls{grid-template-columns:1fr}}
    </style>
</head>
<body>
<main>
    <a href="/projects/">← Projects</a>
    <h1>Trading Card</h1>
    <p class="d">Drop in a PNG, JPEG or WebP photo, drag it into place, write your own stats and download your card. Everything happens in your browser, nothing is uploaded.</p>
    <p id="err" class="d" style="color:#d33;min-height:1.4em;margin:0 0 8px"></p>
    <div class="stage" id="stage"><canvas id="c"></canvas></div>

    <div class="controls">
        <div><label for="name">Name</label><input id="name" type="text" value="AKSHAYA KUMAR" maxlength="20"></div>
        <div><label for="hp">HP</label><input id="hp" type="text" value="70 TB" maxlength="8"></div>
        <div><label for="sub">Title</label><input id="sub" type="text" value="Backend Engineer · Lv 8" maxlength="32"></div>
        <div><label for="theme">Type</label>
            <select id="theme"><option>Fire</option><option>Electric</option><option>Water</option><option>Forest</option><option>Shadow</option></select></div>
        <div><label>Stat 1 (name, 0–10)</label><div class="pair"><input id="l0" type="text" value="Kafka" maxlength="12"><input id="v0" type="number" min="0" max="10" value="9"></div></div>
        <div><label>Stat 2</label><div class="pair"><input id="l1" type="text" value="Caching" maxlength="12"><input id="v1" type="number" min="0" max="10" value="8"></div></div>
        <div><label>Stat 3</label><div class="pair"><input id="l2" type="text" value="Sleep" maxlength="12"><input id="v2" type="number" min="0" max="10" value="2"></div></div>
        <div><label>Stat 4</label><div class="pair"><input id="l3" type="text" value="Coffee" maxlength="12"><input id="v3" type="number" min="0" max="10" value="10"></div></div>
        <div style="grid-column:1/-1"><label for="flavor">Flavor text</label><input id="flavor" type="text" value="Works on my machine. Has been known to invalidate a cache on sight." maxlength="90"></div>
        <div><label for="zoom">Photo zoom</label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></div>
        <div><label><input id="holo" type="checkbox" checked> Holographic shine</label></div>
    </div>

    <div class="btns">
        <button class="primary" id="dl">Download PNG</button>
        <button id="pick">Choose photo</button>
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp">
    </div>
</main>
<script>
    const W=360,H=500,S=2;
    const c=document.getElementById('c'),ctx=c.getContext('2d');
    c.width=W*S;c.height=H*S;c.style.width=W+'px';
    const $=id=>document.getElementById(id);
    const THEMES={
        Fire:['#f6a04d','#e4572e','#fde7c8'],
        Electric:['#fde047','#f59e0b','#fff8d6'],
        Water:['#7dd3fc','#2563eb','#dff1ff'],
        Forest:['#86efac','#15803d','#e4f7e4'],
        Shadow:['#c4b5fd','#6d28d9','#eee8ff']
    };
    let img=null,px=0,py=0;
    (function(){
        const g=document.createElement('canvas');g.width=600;g.height=400;
        const x=g.getContext('2d'),gr=x.createLinearGradient(0,0,600,400);
        gr.addColorStop(0,'#6366f1');gr.addColorStop(1,'#ec4899');
        x.fillStyle=gr;x.fillRect(0,0,600,400);
        x.fillStyle='rgba(255,255,255,.9)';x.font='600 44px system-ui';x.textAlign='center';
        x.fillText('drop a photo',300,215);img=g;
    })();

    function rr(x,y,w,h,r){
        ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
        ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
    }
    function wrap(text,x,y,maxW,lh){
        const words=text.split(' ');let line='';
        for(const w of words){
            const t=line?line+' '+w:w;
            if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);line=w;y+=lh;}else line=t;
        }
        ctx.fillText(line,x,y);
    }

    function draw(){
        const [c1,c2,paper]=THEMES[$('theme').value];
        ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.scale(S,S);
        ctx.globalCompositeOperation='source-over';

        // frame
        const fg=ctx.createLinearGradient(0,0,W,H);fg.addColorStop(0,c1);fg.addColorStop(1,c2);
        rr(0,0,W,H,20);ctx.fillStyle=fg;ctx.fill();
        rr(12,12,W-24,H-24,12);ctx.fillStyle=paper;ctx.fill();

        // header
        ctx.fillStyle='#1c1917';ctx.textBaseline='middle';
        ctx.font='700 20px Georgia,serif';ctx.textAlign='left';
        ctx.fillText($('name').value.toUpperCase(),28,38);
        ctx.font='700 14px Georgia,serif';ctx.textAlign='right';
        ctx.fillStyle=c2;ctx.fillText('HP '+$('hp').value,W-28,38);

        // photo window
        const ix=28,iy=58,iw=W-56,ih=190;
        const z=+$('zoom').value,sc=Math.max(iw/img.width,ih/img.height)*z;
        const dw=img.width*sc,dh=img.height*sc;
        const mx=Math.max(0,(dw-iw)/2),my=Math.max(0,(dh-ih)/2);
        px=Math.max(-mx,Math.min(mx,px));py=Math.max(-my,Math.min(my,py));
        ctx.save();rr(ix,iy,iw,ih,6);ctx.clip();
        ctx.drawImage(img,ix+(iw-dw)/2+px,iy+(ih-dh)/2+py,dw,dh);ctx.restore();
        rr(ix,iy,iw,ih,6);ctx.strokeStyle='#a8a29e';ctx.lineWidth=3;ctx.stroke();

        // title band
        ctx.fillStyle='#57534e';ctx.font='italic 12px Georgia,serif';ctx.textAlign='center';
        ctx.fillText($('sub').value,W/2,iy+ih+16);

        // stats
        for(let i=0;i<4;i++){
            const y=296+i*30,v=Math.max(0,Math.min(10,+$('v'+i).value||0));
            ctx.fillStyle='#1c1917';ctx.font='700 14px Georgia,serif';ctx.textAlign='left';
            ctx.fillText($('l'+i).value,28,y);
            rr(130,y-5,170,10,5);ctx.fillStyle='rgba(0,0,0,.12)';ctx.fill();
            if(v>0){rr(130,y-5,Math.max(10,170*v/10),10,5);ctx.fillStyle=c2;ctx.fill();}
            ctx.fillStyle='#1c1917';ctx.textAlign='right';ctx.fillText(String(v),W-28,y);
        }

        // flavor text
        ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(28,418);ctx.lineTo(W-28,418);ctx.stroke();
        ctx.fillStyle='#44403c';ctx.font='italic 12px Georgia,serif';ctx.textAlign='left';
        wrap($('flavor').value,28,436,W-56,16);
        ctx.fillStyle='#78716c';ctx.font='10px system-ui';ctx.textAlign='center';
        ctx.fillText('akshayakumar.xyz/card',W/2,H-22);

        // holo shine
        if($('holo').checked){
            ctx.save();rr(0,0,W,H,20);ctx.clip();
            const h=ctx.createLinearGradient(0,H,W,0);
            ['#ff6b6b','#ffd93d','#6bff95','#6bd8ff','#b36bff','#ff6bd8'].forEach((col,i,a)=>h.addColorStop(i/(a.length-1),col));
            ctx.globalAlpha=.28;ctx.globalCompositeOperation='overlay';
            ctx.fillStyle=h;ctx.fillRect(0,0,W,H);ctx.restore();
        }
    }

    const OK=['image/png','image/jpeg','image/webp'];
    function msg(t){$('err').textContent=t;}
    function load(file){
        if(!file)return;
        if(!OK.includes(file.type)){msg('Please use a PNG, JPEG or WebP image.');return;}
        const i=new Image();
        i.onload=()=>{img=i;px=py=0;$('zoom').value=1;msg('');draw();};
        i.onerror=()=>msg('That image could not be read. Try another one.');
        i.src=URL.createObjectURL(file);
    }

    let drag=null;
    c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);});
    c.addEventListener('pointermove',e=>{if(!drag)return;px+=e.clientX-drag.x;py+=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};draw();});
    c.addEventListener('pointerup',()=>drag=null);

    document.querySelectorAll('input,select').forEach(el=>{if(el.id!=='file')el.addEventListener('input',draw);});
    $('pick').onclick=()=>$('file').click();
    $('file').onchange=e=>load(e.target.files[0]);
    const st=$('stage');
    st.addEventListener('dragover',e=>{e.preventDefault();st.classList.add('over');});
    st.addEventListener('dragleave',()=>st.classList.remove('over'));
    st.addEventListener('drop',e=>{e.preventDefault();st.classList.remove('over');load(e.dataTransfer.files[0]);});
    $('dl').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trading-card.png';a.click();});
    draw();
</script>
</body>
</html>

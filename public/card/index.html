<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trading Card Studio — Akshaya Kumar</title>
    <meta name="description" content="Turn your photo into a collectible trading card with custom stats.">
    <style>
        :root {
            color-scheme: dark;
            --bg: #090a0b;
            --surface: #111315;
            --fg: #f1f2ef;
            --muted: #858b90;
            --line: #282c2f;
            --accent: #ff5a36;
            --stage: #0d0f10;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        main { width: min(100% - 40px, 1040px); margin: 0 auto; padding: 42px 0 76px; }
        a { color: #a1a6aa; text-decoration: none; font-size: 13px; font-weight: 600; }
        a:hover { color: #fff; }
        h1 { margin: 22px 0 6px; font-size: clamp(28px, 4vw, 38px); line-height: 1.1; letter-spacing: -.045em; font-weight: 750; }
        .d { color: var(--muted); font-size: 14px; margin: 0 0 24px; max-width: 650px; }
        #err { color: #ff8067 !important; min-height: 1.4em; margin: 0 0 10px; }

        /* Two-column layout: sticky live preview on the left, editor on the right */
        .layout { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 22px; align-items: start; }
        .preview { position: sticky; top: 20px; }
        .layout .controls { margin-top: 0; }

        .stage {
            min-height: 0;
            background: radial-gradient(ellipse at 50% 44%, #1a1d1f 0%, #101213 54%, #0b0d0e 100%);
            border: 1px solid #24282a;
            border-radius: 20px;
            padding: 20px 16px;
            display: grid;
            place-items: center;
            transition: border-color .2s, background .2s;
        }
        .stage.over { border-color: var(--accent); }
        .stage > div { width: 100%; display: grid; justify-items: center; }
        .card-wrap {
            width: min(300px, 100%);
            perspective: 1100px;
            transform-style: preserve-3d;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;
            touch-action: none;
            transform: rotateX(0deg) rotateY(0deg) translateZ(0);
            transform-style: preserve-3d;
            transition: transform .22s ease, filter .22s ease;
            filter: drop-shadow(0 24px 34px rgba(0,0,0,.58));
            will-change: transform;
        }
        canvas:active { cursor: pointer; }
        @media (prefers-reduced-motion: reduce) {
            canvas { transition: none; }
        }
        .stage-hint { margin: 13px 0 0; color: #777e82; font-size: 12px; text-align: center; }
        .controls {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 20px;
            padding: 24px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
        }
        .controls > div { min-width: 0; }
        .controls > div[style*="grid-column"] { grid-column: 1 / -1; }
        label { display: block; color: #a2a8ac; font-size: 12px; font-weight: 650; letter-spacing: .015em; margin-bottom: 7px; }
        input[type=text], input[type=number], select {
            width: 100%; min-height: 42px; padding: 9px 12px;
            border-radius: 8px; border: 1px solid #303639;
            background: #0c0e0f; color: #f1f2ef; font: inherit; font-size: 14px; outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input[type=text]:focus, input[type=number]:focus, select:focus {
            border-color: #727b80; box-shadow: 0 0 0 3px rgba(255,255,255,.055);
        }
        input[type=range] { width: 100%; accent-color: var(--accent); }
        input[type=checkbox] { accent-color: var(--accent); vertical-align: -1px; }
        .pair { display: grid; grid-template-columns: minmax(0, 1fr) 68px; gap: 9px; }
        .btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
        button {
            min-height: 42px; padding: 9px 17px; border-radius: 8px;
            border: 1px solid #343a3d; background: #151819; color: #e9ebea;
            font: inherit; font-size: 13px; font-weight: 650; cursor: pointer;
            transition: transform .15s, background .15s, border-color .15s;
        }
        button:hover { transform: translateY(-1px); border-color: #667075; }
        button.primary { background: #f45b3b; color: #100e0d; border-color: #f45b3b; padding-inline: 20px; }
        button.primary:hover { background: #ff7354; }
        button.generator { border-color: #555d61; background: #202426; }
        input[type=file] { display: none; }

        @media (max-width: 860px) {
            .layout { grid-template-columns: 1fr; }
            .preview { position: static; }
            .preview .card-wrap { width: min(340px, 100%); }
        }
        @media (max-width: 560px) {
            main { width: min(100% - 28px, 1040px); padding-top: 26px; }
            .stage { padding: 20px 12px; border-radius: 14px; }
            .controls { grid-template-columns: 1fr; padding: 17px; gap: 14px; }
            .controls > div[style*="grid-column"] { grid-column: auto; }
            .btns { display: grid; grid-template-columns: 1fr 1fr; }
            button { padding-inline: 10px; }
        }
    </style>
</head>
<body>
<main>
    <a href="/projects/">← Projects</a>
    <h1>Trading Card</h1>
    <p class="d">A dark, portrait-first collectible card. Add your photo, set each stat from 0–100, or hit Surprise me to roll a fresh card. Hover over the card for a subtle 3D tilt.</p>
    <p id="err" class="d" style="min-height:1.4em;margin:0 0 8px"></p>

    <div class="layout">
        <div class="preview">
            <div class="stage" id="stage"><div class="card-wrap"><canvas id="c" role="button" tabindex="0" aria-label="Choose or change card photo"></canvas><p class="stage-hint">Click the card to choose or change your photo · Drag to reposition</p></div></div>
            <div class="btns">
                <button class="primary" id="dl">Download PNG</button>
                <button class="generator" id="surprise">✦ Surprise me</button>
                <button id="pick">Choose photo</button>
                <input id="file" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp">
            </div>
        </div>

        <div class="controls">
            <div><label for="name">Name</label><input id="name" type="text" value="AKSHAYA KUMAR" maxlength="20"></div>
            <div><label for="hp">HP</label><input id="hp" type="text" value="70 TB" maxlength="8"></div>
            <div><label for="sub">Title</label><input id="sub" type="text" value="Backend Engineer · Level 08" maxlength="32"></div>
            <div><label for="theme">Type</label>
                <select id="theme"><option>Fire</option><option>Electric</option><option>Water</option><option>Forest</option><option>Shadow</option></select></div>
            <div><label>Stat 1 (name, 0–100)</label><div class="pair"><input id="l0" type="text" value="Kafka" maxlength="12"><input id="v0" type="number" min="0" max="100" step="1" value="90" required></div></div>
            <div><label>Stat 2</label><div class="pair"><input id="l1" type="text" value="Caching" maxlength="12"><input id="v1" type="number" min="0" max="100" step="1" value="80" required></div></div>
            <div><label>Stat 3</label><div class="pair"><input id="l2" type="text" value="Sleep" maxlength="12"><input id="v2" type="number" min="0" max="100" step="1" value="20" required></div></div>
            <div><label>Stat 4</label><div class="pair"><input id="l3" type="text" value="Coffee" maxlength="12"><input id="v3" type="number" min="0" max="100" step="1" value="100" required></div></div>
            <div style="grid-column:1/-1"><label for="flavor">Flavor text</label><input id="flavor" type="text" value="Works on my machine. Has been known to invalidate a cache on sight." maxlength="90"></div>
            <div><label for="zoom">Photo zoom</label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></div>
            <div><label for="edition">Card edition</label><select id="edition"><option value="classic">Classic Collector</option><option value="holo">Holographic Edition</option></select></div>
        </div>
    </div>
</main>
<script>
    const W=360,H=550,S=2;
    const c=document.getElementById('c'),ctx=c.getContext('2d');
    c.width=W*S;c.height=H*S;
    const $=id=>document.getElementById(id);
    const THEMES={
        Fire:['#ff5a36','#ff5a36','#17191b'],
        Electric:['#e5c84b','#e5c84b','#17191b'],
        Water:['#62a9d8','#62a9d8','#17191b'],
        Forest:['#8bb58a','#8bb58a','#17191b'],
        Shadow:['#a58ad6','#a58ad6','#17191b']
    };
    let img=null,px=0,py=0;
    let cardSerial=String(Math.floor(Math.random()*900)+100);
    (function(){
        const g=document.createElement('canvas');g.width=600;g.height=400;
        const x=g.getContext('2d'),gr=x.createLinearGradient(0,0,600,400);
        gr.addColorStop(0,'#6366f1');gr.addColorStop(1,'#ec4899');
        x.fillStyle=gr;x.fillRect(0,0,600,400);
        x.fillStyle='rgba(255,255,255,.9)';x.font='600 44px system-ui';x.textAlign='center';
        x.fillText('drop a photo',300,215);img=g;
    })();

    function rr(x,y,w,h,r){
        ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
        ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
    }
    function wrap(text,x,y,maxW,lh){
        const words=text.split(' ');let line='';
        for(const w of words){
            const t=line?line+' '+w:w;
            if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);line=w;y+=lh;}else line=t;
        }
        ctx.fillText(line,x,y);
    }

    function draw(){
        const [c1,c2] = THEMES[$('theme').value];
        const holographic = $('edition').value === 'holo';
        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0,0,c.width,c.height);
        ctx.scale(S,S);
        ctx.globalCompositeOperation = 'source-over';

        // Deep charcoal card with a fine inset keyline.
        rr(0,0,W,H,18); ctx.fillStyle='#101214'; ctx.fill();
        rr(7,7,W-14,H-14,13); ctx.fillStyle='#171a1c'; ctx.fill();
        rr(7,7,W-14,H-14,13); ctx.strokeStyle='#343a3d'; ctx.lineWidth=1; ctx.stroke();

        // Oversized editorial type creates the layered collectible-card look.
        ctx.save();
        ctx.beginPath(); rr(8,8,W-16,H-16,12); ctx.clip();
        ctx.textAlign='center';
        ctx.textBaseline='alphabetic';
        ctx.fillStyle=c1;
        ctx.globalAlpha=.18;
        ctx.font='900 55px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif';
        ctx.fillText('BUILDER',W/2,205);
        ctx.restore();

        // Top identity strip.
        ctx.textBaseline='middle';
        ctx.textAlign='left';
        ctx.fillStyle='#f3f2ee';
        ctx.font='850 16px system-ui, sans-serif';
        ctx.fillText($('name').value.toUpperCase(),22,31);
        ctx.textAlign='right';
        ctx.fillStyle=c1;
        ctx.font='800 10px system-ui, sans-serif';
        ctx.fillText('HP  '+$('hp').value.toUpperCase(),W-22,30);
        ctx.fillStyle='#727a7e';
        ctx.font='700 8px system-ui, sans-serif';
        ctx.textAlign='left';
        ctx.fillText('COLLECTOR SERIES  /  '+$('theme').value.toUpperCase(),22,52);
        ctx.textAlign='right';
        ctx.fillText('AK  ·  '+cardSerial,W-22,52);
        ctx.fillStyle=c1; ctx.fillRect(22,65,W-44,2);

        // Portrait crop. Taller window gives the image the visual weight of a sports card.
        const ix=76, iy=128, iw=208, ih=238;
        const z=+$('zoom').value, sc=Math.max(iw/img.width,ih/img.height)*z;
        const dw=img.width*sc, dh=img.height*sc;
        const mx=Math.max(0,(dw-iw)/2), my=Math.max(0,(dh-ih)/2);
        px=Math.max(-mx,Math.min(mx,px)); py=Math.max(-my,Math.min(my,py));
        ctx.save();
        rr(ix,iy,iw,ih,5); ctx.clip();
        ctx.filter='saturate(.78) contrast(.96) brightness(.91)';
        ctx.drawImage(img,ix+(iw-dw)/2+px,iy+(ih-dh)/2+py,dw,dh);
        ctx.filter='none';
        // Soft charcoal wash blends the portrait into the dark printed card stock.
        ctx.fillStyle='rgba(12,15,17,.22)';
        ctx.fillRect(ix,iy,iw,ih);
        // A gentle vertical shade keeps the image from feeling like a pasted-in photo.
        const photoShade=ctx.createLinearGradient(ix,iy,ix,iy+ih);
        photoShade.addColorStop(0,'rgba(8,10,12,.10)');
        photoShade.addColorStop(.48,'rgba(8,10,12,0)');
        photoShade.addColorStop(1,'rgba(8,10,12,.16)');
        ctx.fillStyle=photoShade;
        ctx.fillRect(ix,iy,iw,ih);
        ctx.restore();
        rr(ix,iy,iw,ih,5);
        ctx.strokeStyle='#727a7d'; ctx.lineWidth=1.3; ctx.stroke();

        // Nameplate and rarity marker.
        ctx.textAlign='left';
        ctx.fillStyle=c1;
        ctx.font='800 8px system-ui, sans-serif';
        ctx.fillText('PLAYER PROFILE  /  '+$('theme').value.toUpperCase(),22,391);
        ctx.fillStyle='#f4f2ed';
        ctx.font='850 19px system-ui, sans-serif';
        ctx.fillText($('sub').value.toUpperCase(),22,416,316);
        const vals=[0,1,2,3].map(i=>Math.max(0,Math.min(100,Math.round(Number($('v'+i).value)||0))));
        const avg=vals.reduce((a,b)=>a+b,0)/4;
        const rarity=avg>=95?'MYTHIC':avg>=85?'LEGENDARY':avg>=70?'EPIC':avg>=55?'RARE':avg>=40?'UNCOMMON':'COMMON';
        ctx.textAlign='right';
        ctx.fillStyle=c1;
        ctx.font='800 8px system-ui, sans-serif';
        ctx.fillText(rarity,W-22,391);

        // Four compact stat tiles, rather than dashboard-style progress bars.
        const statXs=[22,190], statYs=[452,480];
        for(let i=0;i<4;i++){
            const col=i%2,row=Math.floor(i/2), x=statXs[col], y=statYs[row];
            const v=vals[i];
            ctx.fillStyle='#737c80';
            ctx.font='700 8px system-ui, sans-serif';
            ctx.textAlign='left';
            ctx.fillText($('l'+i).value.toUpperCase(),x,y);
            ctx.textAlign='right';
            ctx.fillStyle='#f2f1ed';
            ctx.font='850 14px system-ui, sans-serif';
            ctx.fillText(String(v).padStart(3,'0')+'/100',x+148,y+1);
            ctx.fillStyle=c1;
            ctx.fillRect(x,y+7,Math.max(3,148*v/100),2);
        }

        // Footer line and flavor copy.
        ctx.strokeStyle='#343a3d'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(22,510); ctx.lineTo(W-22,510); ctx.stroke();
        ctx.textAlign='left';
        ctx.fillStyle='#c2c6c4';
        ctx.font='italic 10px Georgia, serif';
        wrap($('flavor').value,22,528,W-44,12);
        ctx.textAlign='right';
        ctx.fillStyle='#626a6e';
        ctx.font='750 7px system-ui, sans-serif';
        ctx.fillText('AK  /  PERSONAL CARD',W-22,H-12);

        // Holographic finish: controlled iridescence over the dark stock.
        if(holographic){
            ctx.save(); rr(0,0,W,H,18); ctx.clip();
            const foil=ctx.createLinearGradient(0,0,W,H);
            ['#ff6f61','#f2d36f','#75d7b0','#75bce8','#b69ae9','#ef8fc1']
                .forEach((col,i,a)=>foil.addColorStop(i/(a.length-1),col));
            ctx.globalAlpha=.16;
            ctx.globalCompositeOperation='screen';
            ctx.fillStyle=foil; ctx.fillRect(0,0,W,H);
            const glint=ctx.createLinearGradient(20,100,340,420);
            glint.addColorStop(0,'rgba(255,255,255,0)');
            glint.addColorStop(.48,'rgba(255,255,255,.20)');
            glint.addColorStop(.56,'rgba(255,255,255,.025)');
            glint.addColorStop(1,'rgba(255,255,255,0)');
            ctx.globalAlpha=.7; ctx.fillStyle=glint; ctx.fillRect(0,0,W,H);
            ctx.restore();
            rr(7,7,W-14,H-14,13);
            ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1; ctx.stroke();
        }
    }


    const STAT_POOLS = [
        ['Kafka','Go','Rust','Search','Caching','Latency','Scale','Debugging','SQL','Kubernetes'],
        ['Coffee','Focus','Sleep','Patience','Luck','Chaos','Meetings','Context','Shipping','Humour']
    ];
    const FLAVORS = [
        'Works on my machine. Production is a different environment.',
        'Can debug distributed systems. Still cannot find matching socks.',
        'Optimises latency. Occasionally forgets to reply.',
        'Has strong opinions about caches and weak opinions before coffee.',
        'Turns incidents into postmortems and snacks into dinner.',
        'Scales services horizontally. Sleeps vertically.',
        'Fluent in Go, Kafka and saying “let me check the logs”.'
    ];
    function surpriseMe(){
        const themes=Object.keys(THEMES);
        const pick=a=>a[Math.floor(Math.random()*a.length)];
        const labels=[...STAT_POOLS[0],...STAT_POOLS[1]];
        const chosen=[];
        while(chosen.length<4){
            const label=pick(labels);
            if(!chosen.includes(label)) chosen.push(label);
        }
        for(let i=0;i<4;i++){
            $('l'+i).value=chosen[i];
            $('v'+i).value=Math.floor(Math.random()*100)+1;
        }
        $('theme').value=pick(themes);
        $('edition').value=Math.random()<.35?'holo':'classic';
        $('hp').value=String(Math.floor(Math.random()*90)+10)+' HP';
        $('flavor').value=pick(FLAVORS);
        draw();
    }
    $('surprise').addEventListener('click',surpriseMe);

    const OK=['image/png','image/jpeg','image/webp'];
    function msg(t){$('err').textContent=t;}
    function load(file){
        if(!file)return;
        if(!OK.includes(file.type)){msg('Please use a PNG, JPEG or WebP image.');return;}
        const i=new Image();
        i.onload=()=>{img=i;px=py=0;$('zoom').value=1;msg('');draw();};
        i.onerror=()=>msg('That image could not be read. Try another one.');
        i.src=URL.createObjectURL(file);
    }

    let drag=null, moved=false;
    c.addEventListener('pointerdown',e=>{
        drag={x:e.clientX,y:e.clientY};
        moved=false;
        c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove',e=>{
        if(!drag){
            if(e.pointerType==='mouse'){
                const rect=c.getBoundingClientRect();
                const nx=(e.clientX-rect.left)/rect.width-.5;
                const ny=(e.clientY-rect.top)/rect.height-.5;
                c.style.transform=`rotateX(${(-ny*7).toFixed(2)}deg) rotateY(${(nx*8).toFixed(2)}deg) translateZ(7px)`;
                c.style.filter='drop-shadow(0 32px 38px rgba(0,0,0,.68))';
            }
            return;
        }
        const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
        if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
        // Convert screen pixels to card units, since the preview can be shown smaller than the card.
        const k=W/c.getBoundingClientRect().width;
        px+=dx*k; py+=dy*k;
        drag={x:e.clientX,y:e.clientY};
        draw();
    });
    c.addEventListener('pointerup',()=>{
        if(drag && !moved) $('file').click();
        drag=null;
    });
    c.addEventListener('pointercancel',()=>drag=null);
    c.addEventListener('pointerleave',()=>{
        if(!drag){
            c.style.transform='rotateX(0deg) rotateY(0deg) translateZ(0)';
            c.style.filter='drop-shadow(0 24px 34px rgba(0,0,0,.58))';
        }
    });
    c.addEventListener('keydown',e=>{
        if(e.key==='Enter' || e.key===' '){
            e.preventDefault();
            $('file').click();
        }
    });


    // Scores are whole numbers from 0 to 100. Clamp pasted/typed values safely.
    for(let i=0;i<4;i++){
        const scoreInput=$('v'+i);
        scoreInput.addEventListener('input',()=>{
            if(scoreInput.value==='') { draw(); return; }
            const parsed=Number(scoreInput.value);
            if(!Number.isFinite(parsed)) scoreInput.value=0;
            else scoreInput.value=Math.max(0,Math.min(100,Math.round(parsed)));
            scoreInput.setCustomValidity('');
            draw();
        });
        scoreInput.addEventListener('blur',()=>{
            if(scoreInput.value==='') scoreInput.value=0;
            scoreInput.value=Math.max(0,Math.min(100,Math.round(Number(scoreInput.value)||0)));
            scoreInput.setCustomValidity('');
            draw();
        });
    }

    document.querySelectorAll('input,select').forEach(el=>{if(el.id!=='file' && !/^v[0-3]$/.test(el.id))el.addEventListener('input',draw);});
    $('pick').onclick=()=>$('file').click();
    $('file').onchange=e=>load(e.target.files[0]);
    const st=$('stage');
    st.addEventListener('dragover',e=>{e.preventDefault();st.classList.add('over');});
    st.addEventListener('dragleave',()=>st.classList.remove('over'));
    st.addEventListener('drop',e=>{e.preventDefault();st.classList.remove('over');load(e.dataTransfer.files[0]);});

    // Embed provenance in standard PNG tEXt chunks (visible in image metadata viewers).
    function pngCrc32(bytes){
        let crc=0xffffffff;
        for(let i=0;i<bytes.length;i++){
            crc^=bytes[i];
            for(let j=0;j<8;j++) crc=(crc>>>1)^((crc&1)?0xedb88320:0);
        }
        return (crc^0xffffffff)>>>0;
    }
    function pngTextChunk(keyword,value){
        const enc=new TextEncoder();
        const data=enc.encode(keyword+'\0'+value);
        const type=enc.encode('tEXt');
        const body=new Uint8Array(type.length+data.length);
        body.set(type,0); body.set(data,type.length);
        const chunk=new Uint8Array(12+data.length);
        const view=new DataView(chunk.buffer);
        view.setUint32(0,data.length);
        chunk.set(type,4);
        chunk.set(data,8);
        view.setUint32(8+data.length,pngCrc32(body));
        return chunk;
    }
    async function addPngMetadata(blob){
        const bytes=new Uint8Array(await blob.arrayBuffer());
        const chunks=[
            pngTextChunk('Title','Akshaya Kumar - Personal Trading Card'),
            pngTextChunk('Author','Akshaya Kumar'),
            pngTextChunk('Source','https://akshayakumar.xyz/'),
            pngTextChunk('Software','Akshaya Kumar Trading Card Studio'),
            pngTextChunk('Description','A personal collectible card created and downloaded from akshayakumar.xyz.')
        ];
        // Insert metadata immediately before the PNG IEND chunk.
        let offset=8, iend=-1;
        while(offset+12<=bytes.length){
            const length=new DataView(bytes.buffer,bytes.byteOffset+offset,4).getUint32(0);
            const type=String.fromCharCode(...bytes.slice(offset+4,offset+8));
            if(type==='IEND'){iend=offset;break;}
            offset+=12+length;
        }
        if(iend<0) return blob;
        const total=bytes.length+chunks.reduce((n,c)=>n+c.length,0);
        const out=new Uint8Array(total);
        out.set(bytes.slice(0,iend),0);
        let pos=iend;
        for(const chunk of chunks){out.set(chunk,pos);pos+=chunk.length;}
        out.set(bytes.slice(iend),pos);
        return new Blob([out],{type:'image/png'});
    }
    $('dl').onclick=async()=>{
        const raw=await new Promise(resolve=>c.toBlob(resolve,'image/png'));
        if(!raw){msg('Could not export the card. Please try again.');return;}
        const enriched=await addPngMetadata(raw);
        const url=URL.createObjectURL(enriched);
        const a=document.createElement('a');
        a.href=url;a.download='akshaya-trading-card.png';a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1500);
    };
    draw();
</script>
</body>
